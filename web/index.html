<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knitting Pattern Parser</title>
<style>
  :root { color-scheme: light dark; --gap: 1rem; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; } /* author display: block would otherwise win */
  body {
    margin: 0; padding: var(--gap);
    font: 1rem/1.4 system-ui, sans-serif;
    display: flex; flex-direction: column; gap: var(--gap);
  }
  h1 { font-size: 1.25rem; margin: 0; }
  button, label.file {
    display: block; width: 100%; padding: 0.9rem;
    font: inherit; font-weight: 600; text-align: center;
    border: 1px solid currentColor; border-radius: 0.5rem;
    background: none; color: inherit; cursor: pointer;
  }
  button[disabled] { opacity: 0.4; cursor: default; }
  input[type=file] { display: none; }
  img, canvas { display: block; max-width: 100%; margin: 0 auto; }
  h2 { font-size: 1rem; margin: 0; }

  /* Three stacked full-width bands. Both canvases hold one pixel per Cell and
     are stretched by CSS, so 8 and 112 columns both land full width. */
  #knit { display: flex; flex-direction: column; gap: 0.6rem; }
  #knit canvas { width: 100%; image-rendering: pixelated; }
  #overview { position: relative; }
  #whole-chart { height: 6rem; }
  #band { height: 2.5rem; }
  #marker {
    position: absolute; left: 0; right: 0;
    min-height: 3px; /* a Row of a 150-Row chart is under a pixel of the overview */
    outline: 2px solid #c0392b; background: #c0392b40;
  }
  #readout { display: flex; flex-wrap: wrap; gap: 0.5rem; list-style: none; margin: 0; padding: 0; }
  #readout li {
    display: flex; align-items: center; gap: 0.5rem;
    min-height: 44px; padding: 0 0.7rem; /* 44 px: tappable, not merely readable */
    border: 1px solid currentColor; border-radius: 0.5rem;
    font-variant-numeric: tabular-nums;
  }
  .swatch { width: 28px; height: 28px; border: 1px solid currentColor; border-radius: 0.25rem; }
  /* Knitting a Row backwards is the mistake this bar exists to prevent, so it
     says the direction in an arrow and in words, right under the Row it describes. */
  #direction {
    display: flex; align-items: center; gap: 0.6rem;
    margin: 0; padding: 0.4rem 0.7rem;
    font-size: 1.15rem; font-weight: 700;
    border: 2px solid currentColor; border-radius: 0.5rem;
  }
  #direction.left-to-right { flex-direction: row-reverse; } /* the arrow leads, whichever way it points */
  #arrow { font-size: 1.6rem; line-height: 1; }
  .setting { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  .setting select { font: inherit; padding: 0.5rem; flex: 1; min-width: 0; }
  #stage { position: relative; width: fit-content; margin: 0 auto; }
  #overlay { position: absolute; inset: 0; touch-action: none; }
  #hint { margin: 0; text-align: center; opacity: 0.8; }
  #status { text-align: center; animation: pulse 1.4s ease-in-out infinite; }
  #error { padding: 0.75rem; border: 1px solid #c0392b; border-radius: 0.5rem; color: #c0392b; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { #status { animation: none; } }
</style>
</head>
<body>
  <h1>Knitting Pattern Parser</h1>

  <label class="file">
    Choose a chart image
    <input id="file" type="file" accept="image/*">
  </label>

  <p id="hint">Drag a rectangle around the grid. Keep the row and column numbers
    outside it, or the Chart comes out the wrong size.</p>

  <div id="stage" hidden>
    <img id="source" alt="The chart image you chose">
    <canvas id="overlay"></canvas>
  </div>

  <button id="rectangle" disabled>Parse the rectangle</button>
  <button id="whole" disabled>Use whole image</button>

  <p id="status" role="status" hidden></p>
  <p id="error" role="alert" hidden></p>

  <section id="knit" hidden>
    <div id="overview" title="Tap a row to jump to it">
      <canvas id="whole-chart"></canvas>
      <div id="marker"></div>
    </div>
    <canvas id="band"></canvas>
    <p id="direction"><span id="arrow"></span><span id="direction-words"></span></p>
    <h2 id="row-label"></h2>
    <ul id="readout"></ul>
    <button id="next">Next row</button>
    <button id="previous">Previous row</button>
    <button id="flip">Flip this row</button>
    <label class="setting">Construction
      <select id="construction">
        <option value="flat">Flat — the work is turned every row</option>
        <option value="in the round">In the round — never turned</option>
      </select>
    </label>
    <label class="setting">Row 1 reads
      <select id="start">
        <option value="right-to-left">Right to left</option>
        <option value="left-to-right">Left to right</option>
      </select>
    </label>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
